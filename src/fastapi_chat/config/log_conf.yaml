version: 1
disable_existing_loggers: False
formatters:
  default:
    format: '%(asctime)s - %(levelname)s - %(name)s - %(filename)s - %(funcName)s - %(lineno)d - %(message)s'
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stdout
  file_handler:
    formatter: default
    class: logging.handlers.RotatingFileHandler
    filename: fastapi_logger.log
    encoding: utf8
    mode: a
    maxBytes: 1000000
    backupCount: 10
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
      - file_handler
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - default
      - file_handler
    propagate: no
root:
  level: DEBUG
  handlers:
    - default
    - file_handler
  propagate: no
